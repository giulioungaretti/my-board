<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A personal, local collection of things worth keeping. Save products, collect pictures, and find them again." />
    <meta name="theme-color" content="#f3f4f2" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>My Board — Good things, kept close.</title>
    <script>
      (() => {
        const param = new URLSearchParams(window.location.search).get("scoutTheme");
        const theme =
          param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <!--
      THESIS: A personal image collection, not a shopping feed.
      OWN-WORLD: Home design system enamel, chocolate type, physical keys and orange signals.
      STORY: Keep a product, give it tags, return to it without the noise of the original page.
      FIRST VIEWPORT: A quiet collection rail, search and save controls, then the objects themselves.
      FORM: User-requested Pinterest-like masonry, translated into the existing Home design language.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
